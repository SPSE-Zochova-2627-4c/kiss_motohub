{% extends 'base.html' %}
{% block title %}Motorky – MotoHub{% endblock %}
{% block content %}
<main class="wrap">
  <h1>Databáza motoriek</h1>
  <p class="muted">Vyhľadávaj motorky podľa značky, modelu a roku.</p>

  <form class="panel search" id="search">
    <input name="make" placeholder="Značka (napr. KTM)" list="brands">
    <datalist id="brands"></datalist>
    <input name="model" placeholder="Model (napr. Duke 390)">
    <input name="year" placeholder="Rok">
    <button class="btn">Hľadať</button>
  </form>

  <div id="results" data-logged="{{ 1 if user else 0 }}"></div>

  <!-- okno s detailom motorky -->
  <div class="modal" id="modal" onclick="if (event.target === this) this.classList.remove('open')">
    <div class="panel modal-box"><div id="modal-body"></div></div>
  </div>
</main>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/bikes.js') }}"></script>
<script src="{{ url_for('static', filename='js/motorky.js') }}"></script>
{% endblock %}
