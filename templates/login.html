{% extends 'base.html' %}
{% block title %}Prihlásenie – MotoHub{% endblock %}
{% block content %}
<main class="wrap">
  <form class="panel form-card" method="post">
    <h1>Prihlásenie</h1>
    <label>Meno alebo e-mail <input name="username" required></label>
    <label>Heslo <input type="password" name="password" required></label>
    <button class="btn">Prihlásiť sa</button>
    <p class="muted">Nemáš účet? <a href="/registracia">Zaregistruj sa</a></p>
  </form>
</main>
{% endblock %}
